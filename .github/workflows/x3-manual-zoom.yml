
name: Build X3 Manual Manga Zoom

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom branch
        uses: actions/checkout@v4

      - name: Save custom patch
        run: cp manual_zoom.patch /tmp/manual_zoom.patch

      - name: Check out Matcha 2.0.0
        run: |
          git fetch https://github.com/eszter007/matcha-reader.git \
            refs/tags/2.0.0:refs/tags/2.0.0
          git checkout --detach refs/tags/2.0.0
          git submodule update --init --recursive

      - name: Apply custom zoom patch
        run: git apply --check /tmp/manual_zoom.patch && git apply /tmp/manual_zoom.patch
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install compatible PIOArduino
        run: python -m pip install "pioarduino==6.1.19"

      - name: Fix nested PIOArduino environment
        run: |
          python -m pip install uv
          pio pkg install -e default
          uv pip install --python "$HOME/.platformio/penv/bin/python" "pioarduino==6.1.19"
          "$HOME/.platformio/penv/bin/pio" --version

      - name: Build X3 firmware
        run: pio run -e default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: x3-manual-zoom-firmware
          path: .pio/build/default/firmware.bin
          if-no-files-found: error
